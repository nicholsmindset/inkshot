<?xml version="1.0"?>
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">.</dir>
  <cachedir>/tmp/inkshot-fontconfig</cachedir>
  <alias><family>sans-serif</family><prefer><family>Geist</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>Geist</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Instrument Serif</family></prefer></alias>
</fontconfig>
