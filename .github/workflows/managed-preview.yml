name: Disposable managed preview
on:
  pull_request:
    paths:
      - 'server/**'
      - 'supabase/**'
      - 'scripts/check-managed-preview.ts'
      - 'scripts/check-shared-project.ts'
      - 'scripts/setup-shared-live.sql'
      - '.github/workflows/managed-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  managed-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.58.5
      - name: Start disposable Auth, Postgres and Storage
        run: |
          supabase init
          supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Check account and private campaign export
        env:
          AUTH_PROVIDER: supabase
          STORAGE_PROVIDER: supabase
          GENERATION_MODE: mock
          ALLOW_LIVE_GENERATION: 'false'
          FFMPEG_PATH: ${{ github.workspace }}/node_modules/ffmpeg-static/ffmpeg
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY|DB_URL)=')"
          export SUPABASE_URL="$API_URL" SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" SUPABASE_SECRET_KEY="$SERVICE_ROLE_KEY" DATABASE_URL="$DB_URL"
          npx --no-install tsx scripts/check-managed-preview.ts
          npx --no-install tsx scripts/check-shared-project.ts
      - name: Restore live application schema to a separate disposable database
        run: |
          set -euo pipefail
          mapfile -t dbs < <(docker ps --format '{{.Names}}' | grep '^supabase_db_')
          test "${#dbs[@]}" = 1
          db="${dbs[0]}"
          docker exec "$db" pg_dump -U postgres -d postgres --format=custom --schema=inkshot_live > "$RUNNER_TEMP/live-schema.dump"
          docker exec "$db" createdb -U postgres inkshot_restore
          docker exec -i "$db" pg_restore -U postgres -d inkshot_restore --exit-on-error < "$RUNNER_TEMP/live-schema.dump"
          sql="select w.id, w.credits, u.id, m.file_path, p.id
               from inkshot_live.workspaces w join inkshot_live.users u on u.workspace_id=w.id
               join inkshot_live.uploads m on m.workspace_id=w.id cross join inkshot_live.payment_events p
               order by w.id,m.id,p.id"
          for database in postgres inkshot_restore; do
            docker exec "$db" psql -U postgres -d "$database" -Atv ON_ERROR_STOP=1 -c "$sql" > "$RUNNER_TEMP/${database}.rows"
          done
          test -s "$RUNNER_TEMP/postgres.rows"
          cmp "$RUNNER_TEMP/postgres.rows" "$RUNNER_TEMP/inkshot_restore.rows"
      - if: always()
        run: supabase stop --no-backup
